name: Build PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-build-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR metadata
        run: |
          mkdir -p /tmp/pr-meta
          echo "${{ github.event.action }}" > /tmp/pr-meta/action
          echo "${{ github.event.number }}" > /tmp/pr-meta/number

      - name: Checkout
        if: github.event.action != 'closed'
        uses: actions/checkout@v4

      - name: Install pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Build PR Preview
        if: github.event.action != 'closed'
        run: |
          pnpm install --frozen-lockfile
          pnpm build:full
          pnpm playground

      - name: Upload preview artifact
        if: github.event.action != 'closed'
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: ./packages/playground/out

      - name: Upload PR metadata
        uses: actions/upload-artifact@v4
        with:
          name: pr-meta
          path: /tmp/pr-meta
