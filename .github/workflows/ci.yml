name: Build

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

defaults:
  run:
    shell: bash

jobs:
  build:
    name: CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
    - name: Install node modules
      shell: bash
      run: |
        pnpm install --frozen-lockfile
    - name: Build monorepo
      run: |
        pnpm build:full
    - name: Test monorepo
      if: matrix.os != 'ubuntu-latest'
      run: |
        pnpm test
    - name: Test monorepo with coverage gate
      if: matrix.os == 'ubuntu-latest'
      run: |
        pnpm coverage

  check-pretty:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: build
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
    - name: Install node modules
      shell: bash
      run: |
        pnpm install --frozen-lockfile
    - name: Lint sources
      run: |
        pnpm lint
    - name: Check license headers
      if: success() || failure()
      run: |
        pnpm license:check
